<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>關西 6 日 · 京都 × 大阪</title>
<meta name="theme-color" content="#16181C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16181C;
  --ink-soft:#3A3F47;
  --tile:#DDE2E4;
  --card:#FFFFFF;
  --line:#C3CBCE;
  --muted:#6B7480;
  --osaka:#E5171F;
  --kyoto:#6E1F3C;
  --signal:#F5C400;
  --accent:var(--kyoto);
  --rail:52px;
  --pad:16px;
}

*{box-sizing:border-box;margin:0;padding:0}

html{-webkit-text-size-adjust:100%}

body{
  background:var(--tile);
  color:var(--ink);
  font-family:"Noto Sans TC",system-ui,sans-serif;
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}

.shell{max-width:660px;margin:0 auto;background:var(--tile);min-height:100vh}

/* ---------- 站牌式標頭 ---------- */
.masthead{
  background:var(--ink);
  color:#fff;
  padding:calc(18px + env(safe-area-inset-top)) var(--pad) 16px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:12px;
}
.masthead-title{font-size:19px;font-weight:700;letter-spacing:.06em;line-height:1.25}
.masthead-sub{
  font-family:"Barlow Condensed",sans-serif;
  font-size:14px;letter-spacing:.18em;font-weight:500;
  color:#8E97A2;margin-top:3px;text-transform:uppercase;
}
.countdown{text-align:right;flex-shrink:0}
.countdown-num{
  font-family:"Barlow Condensed",sans-serif;
  font-size:36px;font-weight:700;line-height:.9;color:var(--signal);
}
.countdown-label{
  font-family:"Barlow Condensed",sans-serif;
  font-size:11px;letter-spacing:.2em;color:#8E97A2;text-transform:uppercase;
}

/* 月台邊緣的警戒條 —— 全站唯一的黃色 */
.edge{height:5px;background:repeating-linear-gradient(115deg,var(--signal) 0 12px,var(--ink) 12px 24px)}

/* ---------- 日期分頁 ---------- */
.days{
  display:flex;gap:6px;
  padding:12px var(--pad);
  overflow-x:auto;
  scrollbar-width:none;
  background:var(--ink);
}
.days::-webkit-scrollbar{display:none}

.day-tab{
  flex:0 0 auto;
  background:#22262C;border:1px solid #333941;
  color:#A8B1BB;
  border-radius:3px;
  padding:7px 12px 6px;
  cursor:pointer;
  text-align:left;
  font-family:inherit;
  transition:background .15s,color .15s,border-color .15s;
}
.day-tab:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.day-tab .d-date{
  display:block;
  font-family:"Barlow Condensed",sans-serif;
  font-size:19px;font-weight:700;line-height:1;letter-spacing:.02em;
}
.day-tab .d-dow{display:block;font-size:11px;margin-top:2px;letter-spacing:.08em}
.day-tab[aria-selected="true"]{
  background:var(--accent);border-color:var(--accent);color:#fff;
}
.day-tab[data-city="kyoto"][aria-selected="true"]{background:var(--kyoto);border-color:var(--kyoto)}

/* ---------- 當日抬頭 ---------- */
.day-head{padding:20px var(--pad) 14px}
.leg{
  display:inline-flex;align-items:center;gap:7px;
  font-size:12px;font-weight:700;letter-spacing:.1em;
  color:#fff;background:var(--accent);
  padding:4px 10px;border-radius:2px;
}
.day-title{
  font-family:"Barlow Condensed",sans-serif;
  font-size:32px;font-weight:700;letter-spacing:.01em;
  margin-top:10px;line-height:1;
}
.day-title small{font-size:16px;color:var(--muted);font-weight:500;margin-left:8px}

.meter{margin-top:14px}
.meter-bar{height:4px;background:#C6CED1;border-radius:2px;overflow:hidden}
.meter-fill{height:100%;background:var(--accent);width:0;transition:width .35s ease}
.meter-row{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-top:7px;font-size:12px;color:var(--muted);
}
.meter-count{font-family:"Barlow Condensed",sans-serif;font-size:14px;letter-spacing:.05em}
.reset{
  background:none;border:none;font-family:inherit;font-size:12px;
  color:var(--muted);text-decoration:underline;cursor:pointer;padding:2px 0;
}
.reset:hover{color:var(--ink)}
.reset:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.tip{
  margin:14px var(--pad) 0;
  background:var(--card);
  border-left:3px solid var(--signal);
  padding:11px 13px;
  font-size:13px;line-height:1.65;color:var(--ink-soft);
  border-radius:0 3px 3px 0;
}
.tip b{color:var(--ink);font-weight:700}

/* ---------- 路線條 ---------- */
.route{padding:18px var(--pad) 40px}

.stop{
  display:grid;
  grid-template-columns:var(--rail) 22px 1fr;
  column-gap:0;
  position:relative;
}

.stop-time{
  font-family:"Barlow Condensed",sans-serif;
  font-size:17px;font-weight:600;letter-spacing:.03em;
  color:var(--ink-soft);
  padding-top:13px;
  text-align:right;
  padding-right:12px;
  font-variant-numeric:tabular-nums;
}

.stop-rail{position:relative}
.stop-rail::before{
  content:"";position:absolute;
  left:50%;top:0;bottom:0;width:2px;
  transform:translateX(-50%);
  background:var(--line);
}
.stop:first-child .stop-rail::before{top:19px}
.stop:last-child .stop-rail::before{bottom:auto;height:19px}

.stop-dot{
  position:absolute;left:50%;top:13px;
  width:13px;height:13px;border-radius:50%;
  transform:translateX(-50%);
  background:var(--tile);
  border:2.5px solid var(--line);
  transition:background .2s,border-color .2s;
}
.stop.done .stop-dot{background:var(--accent);border-color:var(--accent)}
.stop.done .stop-rail::before{background:var(--accent)}

.stop-body{padding:0 0 16px 14px}
.stop-card{
  background:var(--card);
  border-radius:4px;
  padding:12px 14px;
  box-shadow:0 1px 2px rgba(22,24,28,.07);
}
.stop.done .stop-card{opacity:.55}

.stop-name{
  font-size:16px;font-weight:700;line-height:1.35;
  display:flex;align-items:flex-start;gap:9px;cursor:pointer;
}
.stop-name input{
  appearance:none;-webkit-appearance:none;
  flex:0 0 auto;margin-top:3px;
  width:17px;height:17px;border-radius:3px;
  border:2px solid var(--line);background:var(--card);
  cursor:pointer;position:relative;
}
.stop-name input:checked{background:var(--accent);border-color:var(--accent)}
.stop-name input:checked::after{
  content:"";position:absolute;left:4.5px;top:1px;
  width:4px;height:9px;border:solid #fff;border-width:0 2px 2px 0;
  transform:rotate(42deg);
}
.stop-name input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stop.done .stop-name span{text-decoration:line-through;text-decoration-color:var(--muted)}

.stop-note{font-size:13px;color:var(--ink-soft);margin-top:6px;padding-left:26px;line-height:1.6}

.stop-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;padding-left:26px}
.chip{
  font-size:11.5px;letter-spacing:.03em;
  border:1px solid var(--line);color:var(--muted);
  padding:3px 8px;border-radius:2px;background:var(--tile);
}
.chip.move{border-color:var(--accent);color:var(--accent);background:transparent;font-weight:500}
.chip.opt{border-style:dashed;border-color:var(--muted);color:var(--ink-soft);font-weight:700;letter-spacing:.06em}

.stop.optional .stop-dot{background:var(--tile);border-style:dashed;border-width:2px}
.stop.optional .stop-card{border:1px dashed var(--line);box-shadow:none;background:transparent}
.stop.optional .stop-name{font-weight:500}
.map-link{
  font-size:11.5px;letter-spacing:.06em;font-weight:700;
  color:#fff;background:var(--ink);
  padding:4px 10px;border-radius:2px;text-decoration:none;
}
.map-link:hover{background:var(--accent)}
.map-link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 目前時間指示 */
.now{grid-column:1 / -1;display:grid;grid-template-columns:var(--rail) 22px 1fr;align-items:center;margin:-4px 0 12px}
.now-label{
  font-family:"Barlow Condensed",sans-serif;
  font-size:12px;font-weight:700;letter-spacing:.16em;
  color:var(--ink);text-align:right;padding-right:12px;
}
.now-mark{position:relative;height:12px}
.now-mark::before{
  content:"";position:absolute;left:50%;top:50%;
  width:11px;height:11px;transform:translate(-50%,-50%) rotate(45deg);
  background:var(--signal);border:1.5px solid var(--ink);
}
.now-rule{height:2px;background:var(--signal);margin-left:14px}

/* ---------- 行李清單 ---------- */
.day-tab.pack-tab{
  border-color:#3D444D;background:#1C2026;color:#8E97A2;
  display:flex;align-items:center;gap:6px;padding:9px 13px;
}
.day-tab.pack-tab .d-date{font-size:15px;letter-spacing:.1em}
.day-tab.pack-tab[aria-selected="true"]{background:var(--signal);border-color:var(--signal);color:var(--ink)}
.pack-sep{flex:0 0 1px;background:#333941;margin:4px 3px;align-self:stretch}

.pack-head{padding:20px var(--pad) 0}
.pack-title{font-family:"Barlow Condensed",sans-serif;font-size:32px;font-weight:700;line-height:1}
.pack-title small{font-size:15px;color:var(--muted);font-weight:500;margin-left:8px;font-family:"Noto Sans TC",sans-serif}

.pack-add{display:flex;gap:6px;margin:16px var(--pad) 0;flex-wrap:wrap}
.pack-input{
  flex:1 1 140px;min-width:0;padding:9px 11px;
  border:1px solid var(--line);border-radius:3px;background:var(--card);
  font-family:inherit;font-size:14px;color:var(--ink);outline:none;
}
.pack-input:focus{border-color:var(--accent)}
.pack-select{
  flex:0 0 auto;padding:9px 8px;border:1px solid var(--line);border-radius:3px;
  background:var(--card);font-family:inherit;font-size:13px;color:var(--ink);cursor:pointer;outline:none;
}
.pack-btn{
  flex:0 0 auto;padding:9px 16px;border:none;border-radius:3px;
  background:var(--ink);color:#fff;font-family:inherit;font-size:13px;font-weight:700;
  letter-spacing:.05em;cursor:pointer;
}
.pack-btn:hover{background:var(--accent)}
.pack-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.pack-groups{padding:18px var(--pad) 40px}
.pack-group{margin-bottom:18px}
.pack-group-title{
  font-size:11.5px;font-weight:700;letter-spacing:.16em;color:var(--muted);
  margin-bottom:7px;padding-left:2px;
}
.pack-list{background:var(--card);border-radius:4px;overflow:hidden;box-shadow:0 1px 2px rgba(22,24,28,.07)}
.pack-row{
  display:flex;align-items:center;gap:11px;
  padding:11px 13px;border-bottom:1px solid #E6EAEC;
}
.pack-row:last-child{border-bottom:none}
.pack-row input[type="checkbox"]{
  appearance:none;-webkit-appearance:none;flex:0 0 auto;
  width:17px;height:17px;border-radius:3px;border:2px solid var(--line);
  background:var(--card);cursor:pointer;position:relative;
}
.pack-row input:checked{background:var(--accent);border-color:var(--accent)}
.pack-row input:checked::after{
  content:"";position:absolute;left:4.5px;top:1px;width:4px;height:9px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg);
}
.pack-row input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pack-text{flex:1;font-size:14.5px;line-height:1.45;cursor:pointer}
.pack-row.on .pack-text{color:var(--muted);text-decoration:line-through}
.pack-del{
  flex:0 0 auto;width:26px;height:26px;border:none;background:none;
  color:#B9C1C6;font-size:19px;line-height:1;cursor:pointer;border-radius:3px;
}
.pack-del:hover{background:#F5DADA;color:#C0392B}
.pack-del:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.pack-foot{text-align:center;padding:0 var(--pad) 8px}
.pack-note{font-size:12px;color:var(--muted);line-height:1.7;margin-top:12px}

footer{
  padding:0 var(--pad) 32px;
  font-size:12px;color:var(--muted);line-height:1.7;
}
footer hr{border:none;border-top:1px solid var(--line);margin:0 0 14px}

@media (min-width:600px){
  :root{--pad:28px;--rail:64px}
  body{font-size:16px}
  .masthead-title{font-size:23px}
  .day-title{font-size:38px}
  .stop-time{font-size:19px}
}

@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
}
</style>
</head>
<body>
<div class="shell">

  <header class="masthead">
    <div>
      <div class="masthead-title">關西 6 日 · 京都 × 大阪</div>
      <div class="masthead-sub">26–31 Aug 2026</div>
    </div>
    <div class="countdown">
      <div class="countdown-num" id="cdNum">–</div>
      <div class="countdown-label" id="cdLabel">days</div>
    </div>
  </header>

  <div class="edge"></div>

  <nav class="days" id="days" role="tablist" aria-label="行程日期"></nav>

  <main id="panel"></main>


</div>

    stops: [

      { t:"17:00", n:"飯店 Check-in", d:"下京區因幡堂町。放行李、沖個澡，八月的京都盆地悶到不行。", move:"地下鐵烏丸線 四条 / 阪急 烏丸", map:"691 Inabadocho, Shimogyo Ward, Kyoto" },
      { t:"17:45", n:"四条河原町・鴨川", d:"從飯店往東走十分鐘。過四条大橋時鴨川河堤傍晚坐滿人，是京都夏天的日常風景。順著四条通繼續往東就是祇園。", map:"四条大橋 京都" },
      { t:"18:30", n:"祇園 う桶や〜う〜（晚餐）", d:"米其林收錄的鰻魚飯，在花見小路四条下ル。<b>營業只到 20:00</b>，且訂位僅接受日文電話（075-551-9966），沒訂到就要碰運氣。座位是榻榻米。", map:"祇園 う桶や う 京都" },

    ]
  },
  {

    leg: "京都完整日 · 東山 → 嵐山",
    tip: "<b>念佛寺是機動行程</b>，16:15 停止受付、單程要走 35 分鐘，下午茶拖過 15:20 就放掉，不影響後面。小火車已鎖 13:30 那班，京都車站出發要留 70 分鐘。",
    stops: [
      { t:"06:10", n:"民宿 → 四条高倉", d:"走路 10 分鐘到站牌，搭 207 到東山安井。這個時間巴士很空。", move:"市巴士 207", map:"四条高倉 バス停 京都" },
      { t:"06:50", n:"八坂通・八坂塔", d:"法觀寺五重塔。清晨完全沒人，是這條坡道一天中最好拍的時段。", map:"法観寺 八坂の塔" },
      { t:"07:30", n:"二年坂・三年坂", d:"店家都還沒開，純散步上山。石坂有點滑，注意腳步。", map:"二年坂 京都" },

      { t:"14:45", n:"嵐山庭園 下午茶", d:"要預約，或現場抽號碼牌。", map:"嵐山 京都" },
      { t:"16:00", n:"愛宕念佛寺（機動）", d:"1200 尊表情各異的羅漢石像。<b>16:15 停止受付</b>，下午茶若拖過 15:20 就直接放掉。單程步行約 35 分鐘，趕的話搭京都巴士到「おたぎ寺前」。", move:"步行 或 京都巴士", opt:true, map:"愛宕念仏寺" },
      { t:"17:30", n:"蕎麥麵 → 渡月橋", d:"吃完走到渡月橋，傍晚的光線比中午好看。", map:"渡月橋" },

      { t:"19:30", n:"新京極・河原町一帶", d:"有頂棚的商店街，晚上還很熱鬧。離民宿走路可到，晚餐前有兩小時可以慢慢晃。", map:"新京極商店街" },
      { t:"21:30", n:"Bingo 居酒屋（晚餐）", d:"要預約。這個時間偏晚，訂位時記得確認最後點餐時間。吃完走回民宿。", map:"Bingo 居酒屋 京都" }
    ]
  },
  {
    date: "8/28", dow: "五", city: "osaka", cityName: "京都 → 大阪",
    leg: "移動日 · 稻荷 → 難波",
    tip: "<b>行李一早就寄京都車站置物櫃</b>，下午回來拿。千本鳥居走到四辻看 view 就折返，走到山頂來回要兩小時，會壓到金閣寺。午餐的挽肉と米要先線上訂位。",
    stops: [

function load(key, fallback){
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function save(key, val){
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){}
}

const blankDone = () => TRIP.map(d => d.stops.map(() => false));
let savedDone = load(DONE_KEY, null);
if (!Array.isArray(savedDone) || savedDone.length !== TRIP.length ||
    savedDone.some((d, i) => !Array.isArray(d) || d.length !== TRIP[i].stops.length)) {
  savedDone = blankDone();
}

let packItems = load(PACK_KEY, null);
if (!Array.isArray(packItems) || !packItems.length) {
  packItems = PACK_DEFAULT.map(([text, cat], i) => ({ id: i + 1, text, cat, on: false }));
}
let nextPackId = packItems.reduce((m, i) => Math.max(m, i.id), 0) + 1;

const state = { active: 0, view: "day", done: savedDone };

const $days  = document.getElementById("days");
const $panel = document.getElementById("panel");

/* ---------- 倒數 ---------- */
(function countdown(){
  const start = new Date(YEAR, 7, 26);
  const end   = new Date(YEAR, 7, 31, 23, 59);
  const today = new Date(); today.setHours(0,0,0,0);
  const diff  = Math.round((start - today) / 86400000);
  const num   = document.getElementById("cdNum");
  const label = document.getElementById("cdLabel");
  if (diff > 0)            { num.textContent = "D-" + diff; label.textContent = "to go"; }
  else if (new Date() <= end) { num.textContent = "D" + (diff === 0 ? "" : "+" + -diff); label.textContent = "在路上"; }
  else                     { num.textContent = "完"; label.textContent = "行程結束"; }
})();

/* ---------- 目前該顯示哪一天 ---------- */
function todayIndex(){
  const now = new Date();
  if (now.getFullYear() !== YEAR) return 0;
  const i = TRIP.findIndex(d => {
    const [m, dd] = d.date.split("/").map(Number);
    return now.getMonth() + 1 === m && now.getDate() === dd;
  });
  return i < 0 ? 0 : i;
}

/* ---------- 目前時間該插在哪一站之前 ---------- */
function nowSlot(dayIdx){
  const now = new Date();
  const [m, dd] = TRIP[dayIdx].date.split("/").map(Number);
  if (now.getFullYear() !== YEAR || now.getMonth() + 1 !== m || now.getDate() !== dd) return -1;
  const mins = now.getHours() * 60 + now.getMinutes();
  const idx = TRIP[dayIdx].stops.findIndex(s => {
    const [h, mm] = s.t.split(":").map(Number);
    return h * 60 + mm > mins;
  });
  return idx < 0 ? TRIP[dayIdx].stops.length : idx;
}

/* ---------- 繪製 ---------- */
function select(i){
  state.active = i; state.view = "day";
  packBtn.setAttribute("aria-selected", "false");
  document.documentElement.style.setProperty(
    "--accent", TRIP[i].city === "kyoto" ? "var(--kyoto)" : "var(--osaka)"
  );
  const dayBtns = $days.querySelectorAll(".day-tab:not(.pack-tab)");
  dayBtns.forEach((b, k) => b.setAttribute("aria-selected", k === i));
  dayBtns[i].scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
  render();
}

function mapUrl(q){ return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q); }

function render(){
  const i = state.active, day = TRIP[i];
  const core = day.stops.map((s, k) => !s.opt && state.done[i][k]);
  const doneCount = core.filter(Boolean).length;
  const total = day.stops.filter(s => !s.opt).length;
  const slot = nowSlot(i);

  const stopsHtml = day.stops.map((s, k) => {
    const marker = (k === slot)
      ? `<div class="now"><div class="now-label">NOW</div><div class="now-mark"></div><div class="now-rule"></div></div>`
      : "";
    const chips = [
      s.opt ? `<span class="chip opt">機動</span>` : "",
      s.move ? `<span class="chip move">${s.move}</span>` : "",
      `<a class="map-link" href="${mapUrl(s.map)}" target="_blank" rel="noopener">地圖</a>`
    ].join("");
    return marker + `
      <div class="stop ${state.done[i][k] ? "done" : ""} ${s.opt ? "optional" : ""}">
        <div class="stop-time">${s.t}</div>
        <div class="stop-rail"><span class="stop-dot"></span></div>
        <div class="stop-body">
          <div class="stop-card">
            <label class="stop-name">
              <input type="checkbox" data-k="${k}" ${state.done[i][k] ? "checked" : ""}>
              <span>${s.n}</span>
            </label>
            <div class="stop-note">${s.d}</div>
            <div class="stop-meta">${chips}</div>
          </div>
        </div>
      </div>`;
  }).join("");

  const tail = (slot === total)
    ? `<div class="now"><div class="now-label">NOW</div><div class="now-mark"></div><div class="now-rule"></div></div>`
    : "";

  $panel.innerHTML = `
    <div class="day-head">
      <span class="leg">${day.leg}</span>
      <div class="day-title">${day.date}<small>${day.dow} · ${day.cityName}</small></div>
      <div class="meter">
        <div class="meter-bar"><div class="meter-fill" style="width:${(doneCount/total*100).toFixed(1)}%"></div></div>
        <div class="meter-row">
          <span class="meter-count">${doneCount} / ${total} 完成</span>
          <button class="reset" type="button" id="resetBtn">清除本日打勾</button>
        </div>
      </div>
    </div>
    <div class="tip">${day.tip}</div>
    <div class="route">${stopsHtml}${tail}</div>`;

  $panel.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.addEventListener("change", e => {
      state.done[i][Number(e.target.dataset.k)] = e.target.checked;
      save(DONE_KEY, state.done);
      render();
    });
  });
  document.getElementById("resetBtn").addEventListener("click", () => {
    state.done[i] = state.done[i].map(() => false);
    save(DONE_KEY, state.done);
    render();
  });
}

/* ---------- 行李清單 ---------- */
function selectPack(){
  state.view = "pack";
  [...$days.querySelectorAll(".day-tab")].forEach(b => b.setAttribute("aria-selected", "false"));
  packBtn.setAttribute("aria-selected", "true");
  packBtn.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
  document.documentElement.style.setProperty("--accent", "var(--osaka)");
  renderPack();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function esc(t){
  return String(t).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

function renderPack(){
  const total = packItems.length;
  const done  = packItems.filter(i => i.on).length;

  const groups = PACK_CATS.map(cat => {
    const items = packItems.filter(i => i.cat === cat);
    if (!items.length) return "";
    const rows = items.map(it => `
      <div class="pack-row ${it.on ? "on" : ""}">
        <input type="checkbox" data-id="${it.id}" ${it.on ? "checked" : ""}>
        <label class="pack-text" for="">${esc(it.text)}</label>
        <button class="pack-del" type="button" data-del="${it.id}" aria-label="刪除">×</button>
      </div>`).join("");
    return `<div class="pack-group">
      <div class="pack-group-title">${cat}</div>
      <div class="pack-list">${rows}</div>
    </div>`;
  }).join("");

  const opts = PACK_CATS.map(c =>
    `<option value="${c}"${c === "其他" ? " selected" : ""}>${c}</option>`).join("");

  $panel.innerHTML = `
    <div class="pack-head">
      <div class="pack-title">行李清單<small>出發前打勾</small></div>
      <div class="meter">
        <div class="meter-bar"><div class="meter-fill" style="width:${total ? (done/total*100).toFixed(1) : 0}%"></div></div>
        <div class="meter-row">
          <span class="meter-count">${done} / ${total} 件</span>
          <button class="reset" type="button" id="packReset">重置清單</button>
        </div>
      </div>
    </div>
    <div class="pack-add">
      <input id="packInput" class="pack-input" type="text" placeholder="新增物品…">
      <select id="packCat" class="pack-select">${opts}</select>
      <button class="pack-btn" type="button" id="packAdd">新增</button>
    </div>
    <div class="pack-groups">${groups}</div>
    <div class="pack-foot"></div>`;

  $panel.querySelectorAll('.pack-row input').forEach(cb => {
    cb.addEventListener("change", e => {
      const it = packItems.find(i => i.id === Number(e.target.dataset.id));
      if (it) { it.on = e.target.checked; save(PACK_KEY, packItems); renderPack(); }
    });
  });
  $panel.querySelectorAll('.pack-text').forEach((lb, n) => {
    lb.addEventListener("click", () => lb.previousElementSibling.click());
  });
  $panel.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener("click", e => {
      packItems = packItems.filter(i => i.id !== Number(e.currentTarget.dataset.del));
      save(PACK_KEY, packItems); renderPack();
    });
  });

  const input = document.getElementById("packInput");
  const addIt = () => {
    const t = input.value.trim();
    if (!t) { input.focus(); return; }
    packItems.push({ id: nextPackId++, text: t, cat: document.getElementById("packCat").value, on: false });
    save(PACK_KEY, packItems);
    renderPack();
    document.getElementById("packInput").focus();
  };
  document.getElementById("packAdd").addEventListener("click", addIt);
  input.addEventListener("keydown", e => { if (e.key === "Enter") addIt(); });

  document.getElementById("packReset").addEventListener("click", () => {
    if (!confirm("重置清單？自訂項目會被刪除，勾選也會清空。")) return;
    packItems = PACK_DEFAULT.map(([text, cat], i) => ({ id: i + 1, text, cat, on: false }));
    nextPackId = packItems.length + 1;
    save(PACK_KEY, packItems);
    renderPack();
  });
}

select(todayIndex());
setInterval(() => { if (state.view === "day") render(); }, 60000);
</script>
</body>
</html>
