<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>關西 6 日 · 京都 × 大阪</title>
<meta name="theme-color" content="#16181C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16181C;
  --ink-soft:#3A3F47;
  --tile:#DDE2E4;
  --card:#FFFFFF;
  --line:#C3CBCE;
  --muted:#6B7480;
  --osaka:#E5171F;
  --kyoto:#6E1F3C;
  --signal:#F5C400;
  --accent:var(--kyoto);
  --rail:52px;
  --pad:16px;
}

*{box-sizing:border-box;margin:0;padding:0}

html{-webkit-text-size-adjust:100%}

body{
  background:var(--tile);
  color:var(--ink);
  font-family:"Noto Sans TC",system-ui,sans-serif;
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}

.shell{max-width:660px;margin:0 auto;background:var(--tile);min-height:100vh}

/* ---------- 站牌式標頭 ---------- */
.masthead{
  background:var(--ink);
  color:#fff;
  padding:calc(18px + env(safe-area-inset-top)) var(--pad) 16px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:12px;
}
.masthead-title{font-size:19px;font-weight:700;letter-spacing:.06em;line-height:1.25}
.masthead-sub{
  font-family:"Barlow Condensed",sans-serif;
  font-size:14px;letter-spacing:.18em;font-weight:500;
  color:#8E97A2;margin-top:3px;text-transform:uppercase;
}
.countdown{text-align:right;flex-shrink:0}
.countdown-num{
  font-family:"Barlow Condensed",sans-serif;
  font-size:36px;font-weight:700;line-height:.9;color:var(--signal);
}
.countdown-label{
  font-family:"Barlow Condensed",sans-serif;
  font-size:11px;letter-spacing:.2em;color:#8E97A2;text-transform:uppercase;
}

/* 月台邊緣的警戒條 —— 全站唯一的黃色 */
.edge{height:5px;background:repeating-linear-gradient(115deg,var(--signal) 0 12px,var(--ink) 12px 24px)}

/* ---------- 日期分頁 ---------- */
.days{
  display:flex;gap:6px;
  padding:12px var(--pad);
  overflow-x:auto;
  scrollbar-width:none;
  background:var(--ink);
}
.days::-webkit-scrollbar{display:none}

.day-tab{
  flex:0 0 auto;
  background:#22262C;border:1px solid #333941;
  color:#A8B1BB;
  border-radius:3px;
  padding:7px 12px 6px;
  cursor:pointer;
  text-align:left;
  font-family:inherit;
  transition:background .15s,color .15s,border-color .15s;
}
.day-tab:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.day-tab .d-date{
  display:block;
  font-family:"Barlow Condensed",sans-serif;
  font-size:19px;font-weight:700;line-height:1;letter-spacing:.02em;
}
.day-tab .d-dow{display:block;font-size:11px;margin-top:2px;letter-spacing:.08em}
.day-tab[aria-selected="true"]{
  background:var(--accent);border-color:var(--accent);color:#fff;
}
.day-tab[data-city="kyoto"][aria-selected="true"]{background:var(--kyoto);border-color:var(--kyoto)}

/* ---------- 當日抬頭 ---------- */
.day-head{padding:20px var(--pad) 14px}
.leg{
  display:inline-flex;align-items:center;gap:7px;
  font-size:12px;font-weight:700;letter-spacing:.1em;
  color:#fff;background:var(--accent);
  padding:4px 10px;border-radius:2px;
}
.day-title{
  font-family:"Barlow Condensed",sans-serif;
  font-size:32px;font-weight:700;letter-spacing:.01em;
  margin-top:10px;line-height:1;
}
.day-title small{font-size:16px;color:var(--muted);font-weight:500;margin-left:8px}

.meter{margin-top:14px}
.meter-bar{height:4px;background:#C6CED1;border-radius:2px;overflow:hidden}
.meter-fill{height:100%;background:var(--accent);width:0;transition:width .35s ease}
.meter-row{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-top:7px;font-size:12px;color:var(--muted);
}
.meter-count{font-family:"Barlow Condensed",sans-serif;font-size:14px;letter-spacing:.05em}
.reset{
  background:none;border:none;font-family:inherit;font-size:12px;
  color:var(--muted);text-decoration:underline;cursor:pointer;padding:2px 0;
}
.reset:hover{color:var(--ink)}
.reset:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.tip{
  margin:14px var(--pad) 0;
  background:var(--card);
  border-left:3px solid var(--signal);
  padding:11px 13px;
  font-size:13px;line-height:1.65;color:var(--ink-soft);
  border-radius:0 3px 3px 0;
}
.tip b{color:var(--ink);font-weight:700}

/* ---------- 路線條 ---------- */
.route{padding:18px var(--pad) 40px}

.stop{
  display:grid;
  grid-template-columns:var(--rail) 22px 1fr;
  column-gap:0;
  position:relative;
}

.stop-time{
  font-family:"Barlow Condensed",sans-serif;
  font-size:17px;font-weight:600;letter-spacing:.03em;
  color:var(--ink-soft);
  padding-top:13px;
  text-align:right;
  padding-right:12px;
  font-variant-numeric:tabular-nums;
}

.stop-rail{position:relative}
.stop-rail::before{
  content:"";position:absolute;
  left:50%;top:0;bottom:0;width:2px;
  transform:translateX(-50%);
  background:var(--line);
}
.stop:first-child .stop-rail::before{top:19px}
.stop:last-child .stop-rail::before{bottom:auto;height:19px}

.stop-dot{
  position:absolute;left:50%;top:13px;
  width:13px;height:13px;border-radius:50%;
  transform:translateX(-50%);
  background:var(--tile);
  border:2.5px solid var(--line);
  transition:background .2s,border-color .2s;
}
.stop.done .stop-dot{background:var(--accent);border-color:var(--accent)}
.stop.done .stop-rail::before{background:var(--accent)}

.stop-body{padding:0 0 16px 14px}
.stop-card{
  background:var(--card);
  border-radius:4px;
  padding:12px 14px;
  box-shadow:0 1px 2px rgba(22,24,28,.07);
}
.stop.done .stop-card{opacity:.55}

.stop-name{
  font-size:16px;font-weight:700;line-height:1.35;
  display:flex;align-items:flex-start;gap:9px;cursor:pointer;
}
.stop-name input{
  appearance:none;-webkit-appearance:none;
  flex:0 0 auto;margin-top:3px;
  width:17px;height:17px;border-radius:3px;
  border:2px solid var(--line);background:var(--card);
  cursor:pointer;position:relative;
}
.stop-name input:checked{background:var(--accent);border-color:var(--accent)}
.stop-name input:checked::after{
  content:"";position:absolute;left:4.5px;top:1px;
  width:4px;height:9px;border:solid #fff;border-width:0 2px 2px 0;
  transform:rotate(42deg);
}
.stop-name input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stop.done .stop-name span{text-decoration:line-through;text-decoration-color:var(--muted)}

.stop-note{font-size:13px;color:var(--ink-soft);margin-top:6px;padding-left:26px;line-height:1.6}

.stop-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;padding-left:26px}
.chip{
  font-size:11.5px;letter-spacing:.03em;
  border:1px solid var(--line);color:var(--muted);
  padding:3px 8px;border-radius:2px;background:var(--tile);
}
.chip.move{border-color:var(--accent);color:var(--accent);background:transparent;font-weight:500}
.chip.opt{border-style:dashed;border-color:var(--muted);color:var(--ink-soft);font-weight:700;letter-spacing:.06em}

.stop.optional .stop-dot{background:var(--tile);border-style:dashed;border-width:2px}
.stop.optional .stop-card{border:1px dashed var(--line);box-shadow:none;background:transparent}
.stop.optional .stop-name{font-weight:500}
.map-link{
  font-size:11.5px;letter-spacing:.06em;font-weight:700;
  color:#fff;background:var(--ink);
  padding:4px 10px;border-radius:2px;text-decoration:none;
}
.map-link:hover{background:var(--accent)}
.map-link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 目前時間指示 */
.now{grid-column:1 / -1;display:grid;grid-template-columns:var(--rail) 22px 1fr;align-items:center;margin:-4px 0 12px}
.now-label{
  font-family:"Barlow Condensed",sans-serif;
  font-size:12px;font-weight:700;letter-spacing:.16em;
  color:var(--ink);text-align:right;padding-right:12px;
}
.now-mark{position:relative;height:12px}
.now-mark::before{
  content:"";position:absolute;left:50%;top:50%;
  width:11px;height:11px;transform:translate(-50%,-50%) rotate(45deg);
  background:var(--signal);border:1.5px solid var(--ink);
}
.now-rule{height:2px;background:var(--signal);margin-left:14px}

footer{
  padding:0 var(--pad) 32px;
  font-size:12px;color:var(--muted);line-height:1.7;
}
footer hr{border:none;border-top:1px solid var(--line);margin:0 0 14px}

@media (min-width:600px){
  :root{--pad:28px;--rail:64px}
  body{font-size:16px}
  .masthead-title{font-size:23px}
  .day-title{font-size:38px}
  .stop-time{font-size:19px}
}

@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
}
</style>
</head>
<body>

    stops: [
      { t:"10:00", n:"海遊館", d:"開館即入人最少。全程室內，正好躲掉一天最熱那段。逛完約兩個半小時。", move:"堺筋線→中央線 大阪港站 步行 5 分", map:"海遊館" },
      { t:"12:30", n:"天保山市場街・大摩天輪", d:"海遊館旁邊，午餐解決在這。摩天輪一圈 15 分鐘，看得到整個大阪灣。", map:"天保山マーケットプレース" },
      { t:"14:30", n:"新世界・通天閣", d:"昭和感最濃的一區。串炸醬汁不能二次沾，這是規矩。", move:"中央線→堺筋線 惠美須町", map:"通天閣" },

  {

      { t:"13:30", n:"抵達關西機場", d:"退稅、寄行李。第一航廈的退稅櫃檯在三樓。", map:"関西国際空港 第1ターミナル" }

const YEAR = 2026;
const state = { active: 0, done: TRIP.map(d => d.stops.map(() => false)) };

const $days  = document.getElementById("days");
const $panel = document.getElementById("panel");

/* ---------- 倒數 ---------- */
(function countdown(){
  const start = new Date(YEAR, 7, 26);
  const end   = new Date(YEAR, 7, 31, 23, 59);
  const today = new Date(); today.setHours(0,0,0,0);
  const diff  = Math.round((start - today) / 86400000);
  const num   = document.getElementById("cdNum");
  const label = document.getElementById("cdLabel");
  if (diff > 0)            { num.textContent = "D-" + diff; label.textContent = "to go"; }
  else if (new Date() <= end) { num.textContent = "D" + (diff === 0 ? "" : "+" + -diff); label.textContent = "在路上"; }
  else                     { num.textContent = "完"; label.textContent = "行程結束"; }
})();

/* ---------- 日期分頁 ---------- */
TRIP.forEach((day, i) => {
  const b = document.createElement("button");
  b.className = "day-tab";
  b.type = "button";
  b.setAttribute("role", "tab");
  b.dataset.city = day.city;
  b.innerHTML = `<span class="d-date">${day.date}</span><span class="d-dow">${day.dow}</span>`;
  b.addEventListener("click", () => select(i));
  $days.appendChild(b);
});

/* ---------- 目前該顯示哪一天 ---------- */
function todayIndex(){
  const now = new Date();
  if (now.getFullYear() !== YEAR) return 0;
  const i = TRIP.findIndex(d => {
    const [m, dd] = d.date.split("/").map(Number);
    return now.getMonth() + 1 === m && now.getDate() === dd;
  });
  return i < 0 ? 0 : i;
}

/* ---------- 目前時間該插在哪一站之前 ---------- */
function nowSlot(dayIdx){
  const now = new Date();
  const [m, dd] = TRIP[dayIdx].date.split("/").map(Number);
  if (now.getFullYear() !== YEAR || now.getMonth() + 1 !== m || now.getDate() !== dd) return -1;
  const mins = now.getHours() * 60 + now.getMinutes();
  const idx = TRIP[dayIdx].stops.findIndex(s => {
    const [h, mm] = s.t.split(":").map(Number);
    return h * 60 + mm > mins;
  });
  return idx < 0 ? TRIP[dayIdx].stops.length : idx;
}

/* ---------- 繪製 ---------- */
function select(i){
  state.active = i;
  document.documentElement.style.setProperty(
    "--accent", TRIP[i].city === "kyoto" ? "var(--kyoto)" : "var(--osaka)"
  );
  [...$days.children].forEach((b, k) => b.setAttribute("aria-selected", k === i));
  $days.children[i].scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
  render();
}

function mapUrl(q){ return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q); }

function render(){
  const i = state.active, day = TRIP[i];
  const core = day.stops.map((s, k) => !s.opt && state.done[i][k]);
  const doneCount = core.filter(Boolean).length;
  const total = day.stops.filter(s => !s.opt).length;
  const slot = nowSlot(i);

  const stopsHtml = day.stops.map((s, k) => {
    const marker = (k === slot)
      ? `<div class="now"><div class="now-label">NOW</div><div class="now-mark"></div><div class="now-rule"></div></div>`
      : "";
    const chips = [
      s.opt ? `<span class="chip opt">機動</span>` : "",
      s.move ? `<span class="chip move">${s.move}</span>` : "",
      `<a class="map-link" href="${mapUrl(s.map)}" target="_blank" rel="noopener">地圖</a>`
    ].join("");
    return marker + `
      <div class="stop ${state.done[i][k] ? "done" : ""} ${s.opt ? "optional" : ""}">
        <div class="stop-time">${s.t}</div>
        <div class="stop-rail"><span class="stop-dot"></span></div>
        <div class="stop-body">
          <div class="stop-card">
            <label class="stop-name">
              <input type="checkbox" data-k="${k}" ${state.done[i][k] ? "checked" : ""}>
              <span>${s.n}</span>
            </label>
            <div class="stop-note">${s.d}</div>
            <div class="stop-meta">${chips}</div>
          </div>
        </div>
      </div>`;
  }).join("");

  const tail = (slot === total)
    ? `<div class="now"><div class="now-label">NOW</div><div class="now-mark"></div><div class="now-rule"></div></div>`
    : "";

  $panel.innerHTML = `
    <div class="day-head">
      <span class="leg">${day.leg}</span>
      <div class="day-title">${day.date}<small>${day.dow} · ${day.cityName}</small></div>
      <div class="meter">
        <div class="meter-bar"><div class="meter-fill" style="width:${(doneCount/total*100).toFixed(1)}%"></div></div>
        <div class="meter-row">
          <span class="meter-count">${doneCount} / ${total} 完成</span>
          <button class="reset" type="button" id="resetBtn">清除本日打勾</button>
        </div>
      </div>
    </div>
    <div class="tip">${day.tip}</div>
    <div class="route">${stopsHtml}${tail}</div>`;

  $panel.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.addEventListener("change", e => {
      state.done[i][Number(e.target.dataset.k)] = e.target.checked;
      render();
    });
  });
  document.getElementById("resetBtn").addEventListener("click", () => {
    state.done[i] = state.done[i].map(() => false);
    render();
  });
}

select(todayIndex());
setInterval(render, 60000);
</script>
